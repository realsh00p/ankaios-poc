apiVersion: v1
workloads:
  qemu_1-vm:
    runtime: podman
    agent: linaro
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: localhost/systemd-unit-workload:latest
      commandOptions: ["--privileged", "--pid=host", "--network=host"]
      commandArgs: ["qemu_1.service", "5"]
  qemu_2-vm:
    runtime: podman
    agent: linaro
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: localhost/systemd-unit-workload:latest
      commandOptions: ["--privileged", "--pid=host", "--network=host"]
      commandArgs: ["qemu_2.service", "5"]
  echo-server-40101:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40101"]
  echo-server-40102:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40102"]
  echo-server-40103:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40103"]
  echo-client-40101:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40101", "10", "180"]
  echo-client-40102:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40102", "10", "180"]
  echo-client-40103:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40103", "10", "180"]
