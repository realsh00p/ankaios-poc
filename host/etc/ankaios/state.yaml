apiVersion: v1
workloads:
  echo-server-40101:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40101"]
  echo-server-40102:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40102"]
  echo-server-40103:
    runtime: podman
    agent: qemu_1
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40103"]
  echo-client-40101:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40101", "10"]
  echo-client-40102:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40102", "10"]
  echo-client-40103:
    runtime: podman
    agent: qemu_2
    restartPolicy: NEVER
    runtimeConfig: |
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40103", "10"]
