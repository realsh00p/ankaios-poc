apiVersion: v1
workloads:
  echo-server-40101:
    agent: qemu_1
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40101"]
  echo-client-40102:
    agent: qemu_2
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40102", "10", "180"]
  echo-server-40103:
    agent: qemu_1
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40103"]
  qemu_1-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_1.service'
  echo-client-40103:
    agent: qemu_2
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40103", "10", "180"]
  rollback:
    agent: linaro
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/rollback-workload:latest
      commandOptions: ["--privileged", "--pid=host", "--network=host"]
      commandArgs: ["/userdata/host/etc/rollback-workload/previous-state.yaml", "5", "30"]
  echo-server-40102:
    agent: qemu_1
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40102"]
  qemu_2-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_2.service'
  echo-client-40101:
    agent: qemu_2
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40101", "10", "180"]
