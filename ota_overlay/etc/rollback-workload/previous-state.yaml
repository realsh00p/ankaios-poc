apiVersion: v1
workloads:
  echo-client-40101:
    agent: qemu_2
    restartPolicy: NEVER
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40101", "10", "60"]
  echo-client-40102:
    agent: qemu_2
    restartPolicy: NEVER
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:49999", "10", "60"]
  qemu_1-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_1.service'
  echo-server-40101:
    agent: qemu_1
    restartPolicy: ALWAYS
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40101"]
  echo-client-40103:
    agent: qemu_2
    restartPolicy: NEVER
    dependencies:
      qemu_2-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40103", "10", "60"]
  rollback:
    agent: linaro
    restartPolicy: NEVER
    runtime: systemd
    runtimeConfig: 'serviceName: ankaios-rollback.service'
  qemu_2-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_2.service'
  echo-server-40102:
    agent: qemu_1
    restartPolicy: ALWAYS
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40102"]
  echo-server-40103:
    agent: qemu_1
    restartPolicy: ALWAYS
    dependencies:
      qemu_1-vm: ADD_COND_RUNNING
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40103"]

