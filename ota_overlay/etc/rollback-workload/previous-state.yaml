apiVersion: v1
workloads:
  rollback:
    agent: linaro
    restartPolicy: NEVER
    runtime: systemd
    runtimeConfig: 'serviceName: ankaios-rollback.service'
  echo-server-40101:
    agent: qemu_1
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40101"]
  echo-server-40102:
    agent: qemu_1
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40102"]
  qemu_2-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_2.service'
  echo-client-40103:
    agent: qemu_2
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40103", "10", "180"]
  qemu_1-vm:
    agent: linaro
    restartPolicy: ALWAYS
    runtime: systemd
    runtimeConfig: 'serviceName: qemu_1.service'
  echo-client-40102:
    agent: qemu_2
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40102", "10", "180"]
  echo-server-40103:
    agent: qemu_1
    restartPolicy: ALWAYS
    runtime: podman
    runtimeConfig: |-
      image: docker.io/ealen/echo-server:latest
      commandOptions: ["--network", "host", "-e", "PORT=40103"]
  echo-client-40101:
    agent: qemu_2
    restartPolicy: NEVER
    runtime: podman
    runtimeConfig: |-
      image: localhost/echo-client:latest
      commandArgs: ["http://192.168.10.240:40101", "10", "180"]
